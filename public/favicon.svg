<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark circular backdrop -->
  <circle cx="24" cy="24" r="22" fill="#0B132B" stroke="#1E2D4F" stroke-width="1.5" />

  <!-- Crescent Night Moon -->
  <path d="M 28 8 A 15 15 0 1 0 38 27 A 17 17 0 0 1 28 8 Z" fill="url(#nightGrad)" opacity="0.35" />

  <!-- Traditional Archery Bow Curve -->
  <path d="M 12 36 C 14 26 14 22 24 12 C 26 10 28 10 30 11" 
        stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Bowstring -->
  <line x1="12" y1="36" x2="30" y2="11" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 1" opacity="0.6" />

  <!-- Arrow Shaft -->
  <line x1="15" y1="33" x2="36" y2="12" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Arrowhead (Teer tip) -->
  <path d="M 36 12 L 30 14 L 34 18 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Arrow Fletching / Feathers -->
  <path d="M 15 33 L 13 36 M 17 31 L 15 34 M 14 34 L 16 37" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Subtle Night Stars -->
  <circle cx="34" cy="28" r="1" fill="#FDE047" opacity="0.8" />
  <circle cx="16" cy="16" r="0.8" fill="#F8FAFC" opacity="0.6" />
  <circle cx="28" cy="38" r="0.9" fill="#38BDF8" opacity="0.7" />
</svg>